[package]
name = "md-v"
version = "0.7.2"
description = "A fast Markdown viewer/editor"
authors = ["minichen2000"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "md_v_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 日常开发验证快速构建（npm run build:exe）：关 LTO、多核并行，增量快；产物 target/fast/md-v.exe。
# 正式发版（npm run build:release）走 release（全量 LTO、最大优化），产物 target/release/md-v.exe。
# 两者均 --no-bundle，只产绿色版 exe，不出安装包。
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
